project:
  name: Digital Pathology Copilot
  version: 0.1.0

paths:
  raw_data: data/raw
  processed_data: data/processed
  subset_data: data/subset
  logs: logs

dataset:
  image_size: 96
  batch_size: 32
  num_workers: 4

training:
  epochs: 10
  learning_rate: 0.001
  seed: 42

model:
  name: resnet18
  num_classes: 2

